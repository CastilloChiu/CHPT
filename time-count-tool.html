<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時間差計算機</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
            min-height: 100vh;
            padding: 12px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            padding: 24px;
        }
        h1 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 8px; 
            font-size: clamp(24px, 6vw, 28px);
        }
        .subtitle { 
            text-align: center; 
            color: #888; 
            margin-bottom: 24px; 
            font-size: clamp(12px, 3.5vw, 14px);
        }
        .section-label { 
            font-size: clamp(12px, 3.5vw, 14px); 
            color: #666; 
            font-weight: 600; 
            margin-bottom: 12px; 
        }
        .day-row { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 24px; 
        }
        .day-pill {
            flex: 1;
            padding: clamp(12px, 3vw, 16px);
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            cursor: pointer;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            color: #666;
            transition: all 0.2s;
        }
        .day-pill:hover { border-color: #6dd5ed; }
        .day-pill.active {
            background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
            color: white;
            border-color: transparent;
        }
        .time-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); 
            gap: 10px; 
            margin-bottom: 24px; 
        }
        .time-pill {
            padding: clamp(10px, 2.5vw, 14px);
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            font-size: clamp(13px, 3.5vw, 15px);
            font-weight: 600;
            color: #555;
            transition: all 0.2s;
        }
        .time-pill:hover { border-color: #6dd5ed; background: #eef9fc; }
        .time-pill.active {
            background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
            color: white;
            border-color: transparent;
        }
        .result {
            display: none;
            padding: clamp(15px, 4vw, 20px);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            text-align: center;
        }
        .result.show { display: block; }
        .target { 
            color: #555; 
            font-size: clamp(12px, 3.5vw, 14px); 
            margin-bottom: 12px; 
        }
        .countdown { 
            font-size: clamp(14px, 4vw, 16px); 
            color: #333; 
        }
        .countdown strong { 
            font-size: clamp(20px, 6vw, 28px); 
            color: #2193b0; 
            display: block;
            margin-top: 8px;
        }
        .warning { 
            color: #e74c3c; 
            font-size: clamp(14px, 4vw, 16px); 
            font-weight: 600; 
        }
        .footer { 
            margin-top: 20px; 
            text-align: center; 
            color: #bbb; 
            font-size: clamp(10px, 2.5vw, 12px); 
        }

        /* 平板和電腦版本 */
        @media (min-width: 768px) {
            .container {
                padding: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏰ 時間差計算機</h1>
        <p class="subtitle">選日子 + 選時間，自動計算</p>
        
        <div class="section-label">日子</div>
        <div class="day-row">
            <button class="day-pill active" data-day="0">今天</button>
            <button class="day-pill" data-day="1">明天</button>
        </div>
        
        <div class="section-label">時間</div>
        <div class="time-grid" id="timeGrid"></div>
        
        <div class="result" id="result">
            <div class="target" id="targetDisplay"></div>
            <div class="countdown" id="countdown"></div>
        </div>
        
        <div class="footer">時間差計算機 v2.0 | 24 小時制</div>
    </div>
    
    <script>
        const times = [2, 6, 10, 14, 18, 22];
        let selectedDay = 0;

        function pad(n) { return String(n).padStart(2, '0'); }

        function buildTimeGrid() {
            const grid = document.getElementById('timeGrid');
            times.forEach(h => {
                const btn = document.createElement('button');
                btn.className = 'time-pill';
                btn.textContent = pad(h) + ':00';
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.time-pill').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    calc();
                });
                grid.appendChild(btn);
            });
        }

        document.querySelectorAll('.day-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.day-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDay = parseInt(btn.dataset.day);
                if (document.querySelector('.time-pill.active')) calc();
            });
        });

        function calc() {
            const activeTime = document.querySelector('.time-pill.active');
            const result = document.getElementById('result');
            const targetDisplay = document.getElementById('targetDisplay');
            const countdown = document.getElementById('countdown');
            
            if (!activeTime) {
                result.classList.remove('show');
                return;
            }
            
            const hour = parseInt(activeTime.textContent.split(':')[0]);
            const now = new Date();
            const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + selectedDay, hour, 0, 0);
            const diff = target - new Date();
            
            const dayName = selectedDay === 0 ? '今天' : '明天';
            targetDisplay.textContent = '目標時間：' + dayName + ' ' + pad(target.getHours()) + ':00';
            
            if (diff < 0) {
                countdown.innerHTML = '<span class="warning">⚠️ 這個時間已經過了</span>';
                result.classList.add('show');
                return;
            }
            
            const totalSec = Math.floor(diff / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor((totalSec % 86400) / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            
            let text = '';
            if (days > 0) text += days + ' 天 ';
            text += hours + ' 小時 ' + mins + ' 分';
            
            countdown.innerHTML = '還有 <strong>' + text + '</strong>';
            result.classList.add('show');
        }

        buildTimeGrid();
    </script>
</body>
</html>
