        input:focus { outline: none; border-color: #2193b0; }

        .result.show { display: block; }

        .footer { margin-top: 16px; text-align: center; color: #bbb; font-size: 12px; }

        /* 平板和桌機 */
        @media (min-width: 768px) {
            h1 { font-size: 28px; }

            label { font-size: 18px; }
            input { font-size: 24px; padding: 14px; }
            .total { font-size: 16px; }
            .time { font-size: 56px; }
            .day-note { font-size: 16px; }
        }
    </style>
