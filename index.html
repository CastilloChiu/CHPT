<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castillo | Digital Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 font-sans">
    <!-- 導航欄 -->
    <nav class="border-b border-gray-200 bg-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-bold text-gray-900">Castillo</span>
                <span class="text-sm font-light text-gray-500">Digital Studio</span>
            </div>
            <div class="flex space-x-8 text-sm text-gray-600">
                <a href="#explore" class="hover:text-gray-900 transition">探索</a>
                <a href="#tools" class="hover:text-gray-900 transition">工具</a>
            </div>
        </div>
    </nav>

    <!-- 主要內容 -->
    <main class="max-w-6xl mx-auto px-6 py-16">
        <!-- 探索區域 -->
        <section id="explore">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900">探索</h2>
                <p class="text-gray-500 text-sm mt-1">發現更多精彩內容</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-20">
                <!-- Aurora Tour -->
                <a href="AuroraTour.html" class="group">
                    <div class="border border-gray-200 rounded-lg p-8 hover:border-gray-900 hover:shadow-lg transition duration-300">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <div class="text-4xl mb-3">✨</div>
                                <h3 class="text-xl font-bold text-gray-900">Aurora Tour</h3>
                                <p class="text-gray-600 text-sm mt-2">Start your journey here</p>
                            </div>
                            <span class="text-gray-400 group-hover:text-gray-900 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                </svg>
                            </span>
                        </div>
                        <p class="text-sm text-gray-500">探索我們獨特的設計理念和創意方向</p>
                    </div>
                </a>

                <!-- 西批大師哥 -->
                <a href="https://chiucp.github.io/" class="group">
                    <div class="border border-gray-200 rounded-lg p-8 hover:border-gray-900 hover:shadow-lg transition duration-300">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <div class="text-4xl mb-3">🛠️</div>
                                <h3 class="text-xl font-bold text-gray-900">西批大師哥</h3>
                                <p class="text-gray-600 text-sm mt-2">Magic Tools</p>
                            </div>
                            <span class="text-gray-400 group-hover:text-gray-900 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                </svg>
                            </span>
                        </div>
                        <p class="text-sm text-gray-500">發現更多實用工具和資源</p>
                    </div>
                </a>
            </div>
        </section>

        <!-- 分隔線 -->
        <div class="border-t border-gray-200 my-16"></div>

        <!-- 小工具區域 -->
        <section id="tools">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900">工具集</h2>
                <p class="text-gray-500 text-sm mt-1">快速、實用的日常工具</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                <!-- Time Count Tool -->
                <a href="time-count-tool.html" class="group">
                    <div class="bg-gradient-to-br from-emerald-50 to-emerald-100 border border-emerald-200 rounded-lg p-4 hover:shadow-md transition duration-300">
                        <div class="text-2xl mb-2">⏱️</div>
                        <h3 class="font-semibold text-gray-900 text-sm">計時工具</h3>
                        <p class="text-xs text-gray-600 mt-1">Time Count</p>
                    </div>
                </a>

                <!-- Unit Change Tool -->
                <a href="unit-change-tool.html" class="group">
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 border border-blue-200 rounded-lg p-4 hover:shadow-md transition duration-300">
                        <div class="text-2xl mb-2">🔄</div>
                        <h3 class="font-semibold text-gray-900 text-sm">單位轉換</h3>
                        <p class="text-xs text-gray-600 mt-1">Unit Change</p>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 bg-gray-50 mt-20">
        <div class="max-w-6xl mx-auto px-6 py-12 text-center text-sm text-gray-600">
            <p>&copy; 2026 Castillo Digital Studio. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
